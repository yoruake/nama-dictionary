<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>生词本 - 多语言查词助手</title>
    <link rel="stylesheet" href="vocabulary.css">
  </head>
  <body>
    <main class="vocab-page">
      <header class="vocab-header">
        <div>
          <h1>生词本</h1>
          <p id="vocab-count">0 条生词</p>
        </div>
        <button id="export-csv" type="button" class="primary-button">📥 导出CSV</button>
      </header>

      <section class="toolbar" aria-label="生词筛选">
        <input id="search-input" type="search" placeholder="搜索原词或词义" autocomplete="off">
        <select id="language-filter" aria-label="按语言筛选">
          <option value="">全部语言</option>
        </select>
        <select id="time-filter" aria-label="按时间筛选">
          <option value="all">全部时间</option>
          <option value="today">今天</option>
          <option value="7d">近7天</option>
          <option value="30d">近30天</option>
        </select>
        <select id="export-filter" aria-label="按导出状态筛选">
          <option value="all">全部</option>
          <option value="new">未导出</option>
          <option value="done">已导出</option>
        </select>
        <select id="sort-order" aria-label="排序方式">
          <option value="newest">最新优先</option>
          <option value="oldest">最早优先</option>
          <option value="language">按语言</option>
        </select>
      </section>

      <section id="select-bar" class="select-bar" aria-label="批量操作">
        <span id="select-count">已选 0 项</span>
        <button id="select-all" type="button" class="secondary-button">全选</button>
        <button id="select-clear" type="button" class="secondary-button">清空选择</button>
        <button id="delete-selected" type="button" class="danger-button" disabled>删除选中 (0)</button>
      </section>

      <section id="empty-state" class="empty-state" hidden>
        还没有加入生词本的记录。
      </section>

      <section id="vocab-list" class="vocab-list" aria-live="polite"></section>
    </main>

    <script src="vocabulary.js"></script>
  </body>
</html>
